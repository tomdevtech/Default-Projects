
name: Release VS Code Extension

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check version increase
        id: version
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show "${{ github.event.before }}:package.json" 2>/dev/null | node -e "
            let s='';
            process.stdin.on('data', d => s += d);
            process.stdin.on('end', () => {
              try { console.log(JSON.parse(s).version || '0.0.0'); }
              catch { console.log('0.0.0'); }
            });
          ")

          echo "Previous version: $PREVIOUS"
          echo "Current version:  $CURRENT"

          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged. Skipping release."
            exit 0
          fi

          node - "$PREVIOUS" "$CURRENT" <<'NODE'
          const parse = v => {
            const m = v.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/);
            if (!m) {
              console.error(`Invalid semantic version: ${v}`);
              process.exit(1);
            }
            return [Number(m[1]), Number(m[2]), Number(m[3]), m[4] || ""];
          };

          const a = parse(process.argv[2]);
          const b = parse(process.argv[3]);

          let cmp = 0;
          for (let i = 0; i < 3; i++) {
            if (a[i] !== b[i]) {
              cmp = a[i] > b[i] ? 1 : -1;
              break;
            }
          }

          if (cmp === 0 && a[3] !== b[3]) {
            if (!a[3]) cmp = 1;
            else if (!b[3]) cmp = -1;
            else cmp = b[3].localeCompare(a[3]) < 0 ? 1 : -1;
          }

          if (cmp <= 0) {
            console.error(`Version must increase: ${process.argv[2]} -> ${process.argv[3]}`);
            process.exit(1);
          }
          NODE

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Compile extension
        if: steps.version.outputs.release == 'true'
        run: npm run compile

      - name: Package extension
        if: steps.version.outputs.release == 'true'
        run: npx --yes @vscode/vsce package

      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.release == 'true'
        run: npx --yes @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" ./*.vsix \
            --generate-notes \
            --title "v$VERSION"
