<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Needs Configuration</title>
    <link rel="stylesheet" href="./needs-config.css">
</head>
<body class="config-body">
    <div class="container">
        <h1>Define Project Requirements</h1>
        <p>Tell us about the project you want to create. The system will scaffold the structure for you.</p>

        <form id="project-form">
            <label for="project-name">Project Name:</label>
            <input type="text" id="project-name" name="projectName" required>

            <label for="project-type">Project Type:</label>
            <select id="project-type" name="projectType" required>
                <option value="python">Python (Standard)</option>
                <option value="typescript">TypeScript (Custom)</option>
                <option value="generic">Generic</option>
            </select>

            <label for="custom-needs">Custom Dependencies/Needs (JSON format):</label>
            <textarea id="custom-needs" name="customNeeds" rows="4" placeholder='{"packages": ["pandas", "requests"]}'>{}</textarea>

            <button type="submit" id="submit-btn">Generate Project</button>
        </form>

        <div id="status-message" class="status-hidden"></div>
    </div>
    <script src="./needs-config.js"></script>
</body>
</html>
