<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Viewer</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 15px;
            background-color: var(--vscode-sideBar-background);
            color: var(--vscode-sideBar-foreground);
            margin: 0;
        }
        h1 {
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .status-box {
            padding: 10px;
            border: 1px solid var(--vscode-input-border);
            border-radius: 4px;
            background-color: var(--vscode-input-background);
        }
    </style>
</head>
<body>
    <h1>🚀 Default Projects Viewer</h1>

    <div class="status-box">
        <p>This is the live UI for the selected project, displayed in the sidebar.</p>
        <p>Status: <span id="status">Awaiting Data Load...</span></p>
    </div>

    <button id="refreshButton">Refresh Project Data</button>

    <script>
        const vscode = acquireVsCodeApi();
        const refreshButton = document.getElementById('refreshButton');
        const statusElement = document.getElementById('status');

        // Event Listener to receive messages from the extension
        window.addEventListener('message', event => {
            const message = event.data;
            if (message.command === 'projectDataLoaded') {
                statusElement.textContent = 'Data Loaded Successfully.';
                console.log('Project data received:', message.data);
            }
        });

        // Event Listener for the button click
        refreshButton.addEventListener('click', () => {
            // Send a message back to the extension when the user clicks refresh
            vscode.postMessage({ command: 'refreshProjectData' });
            statusElement.textContent = 'Refreshing...';
        });

        // Initial data request (optional, but good practice)
        // We rely on the extension to push data, but a simple status update can be shown initially.
        window.onload = () => {
            console.log('Project Viewer UI loaded.');
        };
    </script>
</body>
</html>
